name: Pytest (lowest dependencies)

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: pytest-lowest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-lowest:
    name: Run Pytest with minimum dependency versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install minimum dependency versions
        run: uv sync --resolution lowest-direct --python 3.11

      - name: Run pytest
        run: uv run --no-sync pytest
