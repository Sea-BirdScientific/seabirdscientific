name: Pytest (lowest dependencies)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  # A new push to a PR cancels its superseded run. Pushes to main get a group per commit,
  # because GitHub keeps only one pending run per group and would otherwise drop queued runs
  group: pytest-lowest-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-lowest:
    name: Run Pytest with minimum dependency versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install minimum dependency versions
        run: uv sync --resolution lowest-direct --python 3.11

      - name: Run pytest
        run: uv run --no-sync pytest
