name: Ruff Linter

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  # A new push to a PR cancels its superseded run. Pushes to main get a group per commit,
  # because GitHub keeps only one pending run per group and would otherwise drop queued runs
  group: ruff-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check and ruff format
        run: |
          uv run ruff check .
          uv run ruff format --check .