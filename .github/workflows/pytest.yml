name: Pytest

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Coverage is shown in the job's log, and as a table on the job's summary page
      - name: Run pytest
        run: uv run pytest --cov=seabirdscientific --cov-report=term-missing:skip-covered

      # coverage's own markdown report works with every pytest-cov the dev group allows
      # (pytest-cov's markdown-append report needs 6.3 or later)
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
