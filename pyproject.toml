[project]
name = "seabirdscientific"
version = "3.2.0"
description = "Sea-Bird Scientific Community Toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sea-Bird Scientific", email = "techsupport@seabird.com"},
    {name = "Ryan Anderson", email = "randerson@seabird.com"},
    {name = "Lukas Christensen", email = "lchristensen@seabird.com"},
    {name = "Dane Lucas", email = "dlucas@seabird.com"},
    {name = "Eric Rehm", email = "erehm@seabird.com"},
    {name = "Bruce Rhoades", email = "brhoades@seabird.com"},
    {name = "Jesse Templin", email = "jtemplin@seabird.com"},
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "gsw >= 3.6.18",
  "numpy >= 2.2.0",
  "pandas >= 2.3.0",
  "scipy >= 1.15.0",
  "seawater >= 3.3.3",
  "xarray >= 2024.10.0",
]

[project.optional-dependencies]
docs = [
  "sbsfuro >= 0.1.0",
  "sphinx >= 8.2.0",
  "sphinx-mdinclude >= 0.6.2",
]
notebooks = [
  "ipykernel >= 6.30.0",
  "ipython >= 8.10.0",
  "nbconvert[webpdf] >= 7.17.0",
  "nbformat >= 5.11.0",
  "notebook >= 7.6.3", 
]
plots = [
  "kaleido >= 1.0.0",
  "matplotlib >= 3.10.0",
  "plotly >= 6.0.0",
]

[dependency-groups]
dev = [
  "line-profiler >= 4.2.0",
  "pytest >= 9.0.3",
  "pytest-cov >= 6.0.0",
  "ruff >= 0.7.0",
  "seabirdscientific[docs]",
  "seabirdscientific[notebooks]",
  "seabirdscientific[plots]",
]

[project.urls]
Homepage = "https://www.seabird.com/software"
Repository = "https://github.com/Sea-BirdScientific/seabirdscientific"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61",
]

[tool.setuptools.package-data]
seabirdscientific = ["resources/**"]

[tool.ty.src]
include = [
  "src",
  "tests",
]
exclude = [
  "tests/resources",
]

[tool.ruff]
line-length=99
extend-exclude = [
  ".github",
]
src = [
  "src",
  "tests"
]

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.pytest.ini_options]
testpaths = [
  "tests"
]
norecursedirs = [
  "__pycache__",
  "resources",
  "results",
]

